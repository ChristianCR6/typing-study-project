<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typing Study</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Typing Study</h1>

    <div class="participant-box">
        <label for="participantId">Participant ID:</label>
        <input
            type="text"
            id="participantId"
            placeholder="Enter participant ID (e.g. P01)">
    </div>

    <div class="task-selection">
        <label for="taskType">Choose Task Type:</label>
        <select id="taskType">
            <option value="copy">Copy Task</option>
            <option value="prompt">Prompt Task</option>
        </select>
    </div>

    <div class="task">
        <h2>Task</h2>
        <p id="taskText">
            Select a task type and press Start Test.
        </p>
    </div>

    <!-- Task countdown timer -->
    <div class="timer-box">
        <h2>Time Remaining</h2>
        <p id="timer">05:00</p>
    </div>

    <!-- Participant typing area -->
    <textarea
        id="typingInput"
        placeholder="Start typing here..."
        disabled
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off">
    </textarea>

    <button id="startButton">Start Test</button>

</div>

<script src="script.js"></script>

</body>
</html>
