<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typing Study</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Typing Study</h1>

    <div class="task">
        <h2>Task</h2>
        <p id="taskText">
            The quick brown fox jumps over the lazy dog.
        </p>
    </div>

    <!-- Task countdown timer -->
    <div class="timer-box">
        <h2>Time Remaining</h2>
        <p id="timer">05:00</p>
    </div>

    <!-- Participant typing area -->
    <textarea
        id="typingInput"
        placeholder="Start typing here..."
        disabled>
    </textarea>

    <button id="startButton">Start Test</button>

</div>

<script src="script.js"></script>

</body>
</html>
